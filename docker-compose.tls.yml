# Option : HTTPS devant Kaji (Caddy, certificat interne). À ajouter au fichier principal :
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
# Puis dans .env : KAJI_COOKIE_SECURE=true, KAJI_TLS_SITE=<adresse de la machine> (sans port : HTTPS sur 443, le port 80 renvoie vers HTTPS) (voir docs/deploiement.md, « HTTPS »).
# NON testé en réel par les agents (pas de Docker sur leur poste) : relis `docs/deploiement.md` avant de l'activer sur une machine qui compte.
services:
  tls:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      KAJI_TLS_SITE: ${KAJI_TLS_SITE:-localhost}      # adresse SANS port (voir deploy/Caddyfile)
      KAJI_TLS_NAME: ${KAJI_TLS_NAME:-kaji.localhost}  # un nom en plus de l'adresse (ex. kaji.home) ; doit différer de KAJI_TLS_SITE
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data              # l'autorité interne et ses clés : à sauvegarder si tu veux garder la confiance des navigateurs
      - caddy-config:/config
    ports:
      - "${KAJI_TLS_BIND:-0.0.0.0}:${KAJI_TLS_PORT:-443}:443"
      - "${KAJI_TLS_BIND:-0.0.0.0}:${KAJI_HTTP_PORT:-80}:80"      # le port 80 ne sert qu'à renvoyer vers HTTPS (Caddy)

  web:
    volumes:
      # nginx reprend l'adresse du client donnée par Caddy (sinon tous les clients auraient celle de Caddy et partageraient le même limiteur de connexions).
      - ./deploy/realip.conf:/etc/nginx/conf.d/realip.conf:ro

# Réseau à adresses fixes : `deploy/realip.conf` n'accorde sa confiance qu'à ce sous-réseau.
networks:
  default:
    ipam:
      config:
        - subnet: 172.29.77.0/24

volumes:
  caddy-data:
  caddy-config:
