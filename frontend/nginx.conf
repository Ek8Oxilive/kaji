# Kaji : fichiers statiques + relais de /api vers le backend (service « backend » du docker-compose).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;                       # l'API ne reçoit que de petits corps JSON

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Console web (noVNC, xterm.js) : WebSocket. Mise à niveau du protocole, pas de tampon, connexion longue.
    # `Host` doit garder le PORT (`$http_host`, pas `$host`) : le backend compare l'en-tête `Origin` (avec port) à `Host` pour
    # refuser les WebSocket venus d'un autre site. Sans le port, toutes les consoles seraient refusées en `:8080`.
    location /api/console/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # API : le backend pose ses propres en-têtes de sécurité (nosniff, DENY, no-store). Pas de tampon : le flux
    # temps réel (SSE, /api/connections/{id}/events) doit arriver au fil de l'eau et rester ouvert longtemps.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Écrase X-Forwarded-For par l'adresse vue par nginx (ne recopie JAMAIS celle du client : falsifiable).
        # Avec KAJI_TRUST_PROXY=true, le backend utilise cette valeur pour son limiteur de connexions.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Fichiers générés : nom contenant un hash, cache illimité.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Application : jamais en cache, repli sur index.html (routage côté navigateur).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }
}
